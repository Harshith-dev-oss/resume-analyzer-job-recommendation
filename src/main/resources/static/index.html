<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>AI Resume Analyzer</h1>
        <p>Resume Analysis & Job Recommendation System</p>
    </header>

    <main>

        <section class="card">
            <h2>Upload Resume</h2>

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                style="margin-bottom: 20px;"
            >

            <div style="margin-bottom: 20px; padding: 20px; border: 2px dashed #ccc; border-radius: 6px; text-align: center; background: #fafafa;">
                <label for="resumePdf" style="font-weight: bold; display: block; margin-bottom: 10px;">Select PDF Resume</label>
                <input
                    type="file"
                    id="resumePdf"
                    accept="application/pdf"
                    style="margin: 0 auto; display: block; padding: 0; border: none; width: auto;"
                >
            </div>

            <button onclick="analyzeResume()">
                Analyze Resume
            </button>
        </section>

        <section class="card" id="result">
            <h2>Analysis Result</h2>
            <div id="output">
                Upload your resume details and click Analyze Resume.
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
